<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - SmartMess</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px;">
    <h3 class="mb-4 text-center">Login</h3>
    <div id="msg"></div>
    <div class="mb-3"><input id="email" type="email" class="form-control" placeholder="Email"></div>
    <div class="mb-3"><input id="password" type="password" class="form-control" placeholder="Password"></div>
    <button id="btn" class="btn btn-primary w-100">Login</button>
    <p class="mt-3 text-center">New student? <a href="register.html">Register</a></p>
</div>

<script>
    const msg = document.getElementById("msg");

    document.getElementById("btn").addEventListener("click", async () => {
        // The login API expects form fields, not JSON
        const form = new URLSearchParams();
        form.append("email", document.getElementById("email").value.trim());
        form.append("password", document.getElementById("password").value);
        try {
            const res = await fetch("/api/auth/login", { method: "POST", body: form });
            if (res.status === 200) {
                window.location.href = "dashboard.html";
            } else {
                msg.innerHTML = '<div class="alert alert-danger">Wrong email or password, or your account is not approved yet.</div>';
            }
        } catch (e) {
            msg.innerHTML = '<div class="alert alert-danger">Cannot reach the server.</div>';
        }
    });
</script>
</body>
</html>
