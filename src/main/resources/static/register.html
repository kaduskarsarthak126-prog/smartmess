<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - SmartMess</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px;">
    <h3 class="mb-4 text-center">Student Registration</h3>
    <div id="msg"></div>
    <div class="mb-3"><input id="name" class="form-control" placeholder="Full name"></div>
    <div class="mb-3"><input id="email" type="email" class="form-control" placeholder="Email"></div>
    <div class="mb-3"><input id="password" type="password" class="form-control" placeholder="Password (min 6 characters)"></div>
    <div class="mb-3"><input id="hostelRoom" class="form-control" placeholder="Hostel room (e.g. B-204)"></div>
    <button id="btn" class="btn btn-primary w-100">Register</button>
    <p class="mt-3 text-center">Already registered? <a href="login.html">Login</a></p>
</div>

<script>
    const msg = document.getElementById("msg");

    function show(text, type) {
        msg.innerHTML = '<div class="alert alert-' + type + '"></div>';
        msg.firstChild.textContent = text;   // textContent keeps it safe
    }

    document.getElementById("btn").addEventListener("click", async () => {
        const body = {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
            hostelRoom: document.getElementById("hostelRoom").value.trim()
        };
        try {
            const res = await fetch("/api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            if (res.status === 201) {
                show("Registered. Wait for the admin to approve your account, then login.", "success");
            } else if (res.status === 409) {
                show("This email is already registered.", "warning");
            } else if (res.status === 400) {
                show("Please check your details: name and valid email are required, password needs 6+ characters.", "danger");
            } else {
                show("Something went wrong. Try again.", "danger");
            }
        } catch (e) {
            show("Cannot reach the server.", "danger");
        }
    });
</script>
</body>
</html>
